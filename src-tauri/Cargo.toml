[package]
name = "dev-archaeologist"
version = "0.4.0"
edition = "2021"
default-run = "dev-archaeologist"

[lib]
name = "devarch"
path = "src/lib.rs"

[[bin]]
name = "dev-archaeologist"
path = "src/main.rs"

[[bin]]
name = "dev-arch"
path = "src/bin/dev-arch.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
ulid = "1"
anyhow = "1"
notify = "8"
ureq = { version = "3", features = ["json"] }
dirs = "6"
crossbeam-channel = "0.5"
keyring = { version = "3", features = ["apple-native"] }

